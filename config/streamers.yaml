# Стримеры, чьи клипы берём.
#
# Смысл списка — узнаваемость. Для аудитории СНГ знакомое лицо в кадре
# весит больше, чем то, насколько момент смешной сам по себе: зритель
# останавливается, потому что узнал человека, а не потому что смешно.
# Топовый клип с неизвестным иностранцем пролистают.
#
# login    — как в адресе twitch.tv/<login>
# facecam  — есть ли вебка. Без неё узнавать нечего, и весь смысл теряется.
# note     — для себя

streamers:
  - login: ""          # <- логины сюда
    facecam: true
    note: ""
