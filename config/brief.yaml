# Бриф формата под оригинальную анимацию.
#
# Это единственный файл, который заполняется головой. Дальше:
#   mily anim prompt   -> заготовка запроса на раскадровку
#   (ответ модели вернуть сюда, в ключ shots)
#   mily anim shots    -> shots.json
#   ... генерация сцен в Higgsfield, файлы в clips/anim/ ...
#   mily anim assemble -> assemble.jsx для After Effects

